              @PluginMethod public void export(PluginCall call){
                  if(!unlocked(call))return;getActivity().runOnUiThread(()->{
                      if(recorder!=null||!exporting.compareAndSet(false,true)){call.reject("Finish recording first","BUSY");return;}
                      try{
                          String id=validId(call.getString("id",""));JSONObject meta=metadata(id);releasePlayer();
                          String name=cleanTitle(meta.optString("title")).replaceAll("[\\\\/:*?\"<>|\\p{Cntrl}]","_")+".m4a";
                          Intent intent=new Intent(Intent.ACTION_CREATE_DOCUMENT);intent.addCategory(Intent.CATEGORY_OPENABLE);intent.setType("audio/mp4");intent.putExtra(Intent.EXTRA_TITLE,name);
                          startActivityForResult(call,intent,"audioDestinationChosen");
                      }catch(Exception error){exporting.set(false);call.reject("Cannot export recording","STORAGE",error);}
                  });
              }
              @ActivityCallback private void audioDestinationChosen(PluginCall call,ActivityResult result){
                  if(call==null){exporting.set(false);return;}
                  if(result.getResultCode()!=Activity.RESULT_OK||result.getData()==null||result.getData().getData()==null){exporting.set(false);JSObject response=new JSObject();response.put("cancelled",true);call.resolve(response);return;}
                  final Uri uri=result.getData().getData();
                  getBridge().execute(()->{
                      try{
                          String id=validId(call.getString("id",""));File source=file(id,".m4a");long copied=0;
                          try(InputStream in=new FileInputStream(source);OutputStream out=getContext().getContentResolver().openOutputStream(uri,"wt")){
                              if(out==null)throw new IOException("Destination unavailable");byte[] buffer=new byte[32768];int n;
                              while((n=in.read(buffer))!=-1){out.write(buffer,0,n);copied+=n;}out.flush();
                          }
                          if(copied!=source.length())throw new IOException("Incomplete export");JSObject response=new JSObject();response.put("saved",true);call.resolve(response);
                      }catch(Exception error){try{android.provider.DocumentsContract.deleteDocument(getContext().getContentResolver(),uri);}catch(Exception ignored){}call.reject("Cannot save audio file","STORAGE",error);}
                      finally{exporting.set(false);}
                  });
