              /** Explicit app lock, leaving the app, calls or screen-off stop and save microphone use. */
              void interruptForSecurity(){stopAndSave();pausePlayback();}
              @Override protected void handleOnPause(){visible=false;interruptForSecurity();}
              @Override protected void handleOnResume(){visible=true;if(pendingStart!=null){PluginCall call=pendingStart;pendingStart=null;getActivity().runOnUiThread(()->startReady(call));}}
