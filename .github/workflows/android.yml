              private void jump(){if(pageCount<1)return;EditText input=new EditText(this);input.setInputType(InputType.TYPE_CLASS_NUMBER);input.setText(String.valueOf(pageIndex+1));input.setSelectAllOnFocus(true);
                  AlertDialog dialog=new AlertDialog.Builder(this).setTitle(text("د پاڼې شمېره","شمارۀ صفحه","Page number")).setView(input).setNegativeButton(text("بندول","بستن","Cancel"),null).setPositiveButton(text("پرانیستل","باز کردن","Go"),null).create();
                  dialog.setOnShowListener(ignored->dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v->{try{int chosen=Integer.parseInt(input.getText().toString());if(chosen<1||chosen>pageCount)throw new NumberFormatException();pageIndex=chosen-1;dialog.dismiss();render();}catch(NumberFormatException error){input.setError("1 – "+pageCount);}}));dialog.show();
