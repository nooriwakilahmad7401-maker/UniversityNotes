name: University Notes Android

on:
  push:
    branches: [main]
    paths: ['noori-1.html', 'wakil.html', '.github/workflows/android.yml', 'privacy-policy.html']
  workflow_dispatch:
    inputs:
      html_file:
        description: 'HTML filename in the repository root'
        type: string
        default: 'noori-1.html'
      release:
        description: 'Create a signed Play Store AAB (requires your upload-key secrets)'
        type: boolean
        default: false
      version_code:
        description: 'Must exceed the versionCode already uploaded to Play. Empty = 1000 + run number'
        type: string
        default: ''
      version_name:
        description: 'Visible app version'
        type: string
        default: '1.1.0'

permissions:
  contents: read

concurrency:
  group: university-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && 'true' || 'false' }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      APP_VERSION_NAME: ${{ inputs.version_name }}
      SOURCE_HTML: ${{ inputs.html_file || 'noori-1.html' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Prepare isolated web source
        run: |
          set -euo pipefail
          python3 - <<'PYINIT'
          import os, shutil, json
          from pathlib import Path
          source_name = os.environ['SOURCE_HTML']
          if Path(source_name).name != source_name or not source_name.endswith('.html'):
              raise SystemExit('HTML must be a filename in the repository root')
          source = Path(source_name)
          if not source.is_file(): raise SystemExit(f'Upload the corrected HTML as {source_name} first')
          target = Path(os.environ['RUNNER_TEMP']) / 'university-notes-build'
          target.mkdir(parents=True, exist_ok=True)
          (target / 'www').mkdir(exist_ok=True)
          shutil.copy2(source, target / 'www/index.html')
          # Match an existing local Capacitor origin to retain its Local Storage.
          server = {'hostname': 'localhost', 'androidScheme': 'https'}
          old_config = Path('capacitor.config.json')
          if old_config.is_file():
              existing = json.loads(old_config.read_text()).get('server', {})
              if existing.get('androidScheme') in ('http', 'https'):
                  server['androidScheme'] = existing['androidScheme']
              if existing.get('hostname'):
                  if existing['hostname'] not in ('localhost',):
                      raise SystemExit('Custom hostname: review storage migration before changing it')
                  server['hostname'] = existing['hostname']
          config = {'appId':'com.noori.universitynotes','appName':'University Notes','webDir':'www',
                    'server':server,'android':{'allowMixedContent':False},
                    'plugins':{'SystemBars':{'insetsHandling':'native','initialViewportFitValueHint':'cover'}}}
          (target / 'capacitor.config.json').write_text(json.dumps(config, indent=2))
          (target / 'package.json').write_text(json.dumps({'name':'university-notes-android','version':'1.1.0','private':True}))
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write(f'WORK_DIR={target}\n')
          PYINIT
      - name: Install pinned Capacitor and add Android
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          npm install --save-exact --no-audit --no-fund @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3
          npx cap add android
          npx cap sync android
      - name: Add native Back and offline PDF support
        run: |
          set -euo pipefail
          cd "$WORK_DIR"
          python3 - <<'PYNATIVE'
          # Applied to a fresh, isolated Capacitor Android template; never modifies the repository.
          import os, re, json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          
          base = Path.cwd()
          namespace = 'com.noori.universitynotes'
          java_dir = base / 'android/app/src/main/java/com/noori/universitynotes'
          java_dir.mkdir(parents=True, exist_ok=True)
          (java_dir / 'MainActivity.java').write_text('package com.noori.universitynotes;\n\nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport androidx.activity.OnBackPressedCallback;\nimport com.getcapacitor.BridgeActivity;\n\n/** Hardware button and gesture Back use the same JS navigation as browser Back. */\npublic class MainActivity extends BridgeActivity {\n    private boolean checkingBack = false;\n\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(UniversityNativePlugin.class);\n        super.onCreate(savedInstanceState);\n        if (getBridge() == null) return;\n        getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {\n            @Override\n            public void handleOnBackPressed() {\n                if (checkingBack) return;\n                final WebView webView = getBridge().getWebView();\n                if (webView == null) { moveTaskToBack(true); return; }\n                checkingBack = true;\n                webView.evaluateJavascript(\n                    "(function(){return typeof window.UniversityNotesBack===\'function\' ? window.UniversityNotesBack() : true;})()",\n                    result -> {\n                        checkingBack = false;\n                        // Only Home returns false. Keep data/activity intact in background.\n                        if ("false".equals(result)) moveTaskToBack(true);\n                    }\n                );\n                webView.postDelayed(() -> checkingBack = false, 1000);\n            }\n        });\n    }\n}\n', encoding='utf-8')
          (java_dir / 'UniversityNativePlugin.java').write_text('package com.noori.universitynotes;\n\nimport android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\nimport android.util.Base64;\nimport androidx.activity.result.ActivityResult;\nimport com.getcapacitor.JSObject;\nimport com.getcapacitor.Plugin;\nimport com.getcapacitor.PluginCall;\nimport com.getcapacitor.PluginMethod;\nimport com.getcapacitor.annotation.ActivityCallback;\nimport com.getcapacitor.annotation.CapacitorPlugin;\nimport java.io.OutputStream;\nimport java.nio.charset.StandardCharsets;\nimport java.util.concurrent.atomic.AtomicBoolean;\n\n/** Local-only file export. No storage permission, server or JS interface added. */\n@CapacitorPlugin(name = "UniversityNative")\npublic class UniversityNativePlugin extends Plugin {\n    private final AtomicBoolean saving = new AtomicBoolean(false);\n    private static final int MAX_BASE64_LENGTH = 35 * 1024 * 1024;\n\n    @PluginMethod\n    public void savePdf(PluginCall call) {\n        String data = call.getString("data", "");\n        if (data.isEmpty() || data.length() > MAX_BASE64_LENGTH) {\n            call.reject("PDF size is invalid"); return;\n        }\n        if (!saving.compareAndSet(false, true)) { call.reject("Another save is active"); return; }\n        String name = call.getString("fileName", "University-Notes.pdf")\n            .replaceAll("[\\\\\\\\/:*?\\"<>|\\\\p{Cntrl}]", "_");\n        if (!name.endsWith(".pdf")) name += ".pdf";\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType("application/pdf");\n        intent.putExtra(Intent.EXTRA_TITLE, name);\n        try { startActivityForResult(call, intent, "pdfDestinationChosen"); }\n        catch (Exception error) { saving.set(false); call.reject("Cannot open document picker", error); }\n    }\n\n    @ActivityCallback\n    private void pdfDestinationChosen(PluginCall call, ActivityResult result) {\n        if (call == null) { saving.set(false); return; }\n        if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {\n            saving.set(false);\n            JSObject response = new JSObject(); response.put("cancelled", true); call.resolve(response); return;\n        }\n        final Uri uri = result.getData().getData();\n        // Large file writes must not block the Android UI thread.\n        getBridge().execute(() -> {\n            try {\n                String encoded = call.getString("data", "");\n                if (encoded.length() > MAX_BASE64_LENGTH) throw new IllegalArgumentException("PDF too large");\n                byte[] bytes = Base64.decode(encoded, Base64.DEFAULT);\n                if (bytes.length < 5 || !new String(bytes, 0, 5, StandardCharsets.US_ASCII).equals("%PDF-")) {\n                    throw new IllegalArgumentException("Invalid PDF");\n                }\n                try (OutputStream output = getContext().getContentResolver().openOutputStream(uri, "wt")) {\n                    if (output == null) throw new IllegalStateException("Destination unavailable");\n                    output.write(bytes); output.flush();\n                }\n                JSObject response = new JSObject(); response.put("saved", true); call.resolve(response);\n            } catch (Exception error) {\n                call.reject("Cannot save PDF to the selected destination", error);\n            } finally { saving.set(false); }\n        });\n    }\n\n    @PluginMethod\n    public void openExternal(PluginCall call) {\n        try {\n            String url = call.getString("url", "");\n            // Only the developer\'s two existing contact destinations are allowed.\n            if (!("https://wa.me/93704287401".equals(url) || "https://www.facebook.com/share/19suowiLHi/".equals(url))) {\n                call.reject("External destination not allowed"); return;\n            }\n            Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));\n            getActivity().runOnUiThread(() -> {\n                try { getActivity().startActivity(intent); call.resolve(); }\n                catch (Exception error) { call.reject("No app can open this link", error); }\n            });\n        } catch (Exception error) { call.reject("Cannot open link", error); }\n    }\n}\n', encoding='utf-8')
          
          # Preserve package ID for updates. API 36 is required for new phone apps in Oct 2026.
          variables = base / 'android/variables.gradle'
          s = variables.read_text()
          s = re.sub(r'compileSdkVersion = \d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion = \d+', 'targetSdkVersion = 36', s)
          variables.write_text(s)
          version_code = int(os.environ.get('APP_VERSION_CODE') or (1000 + int(os.environ.get('GITHUB_RUN_NUMBER', '1'))))
          if not 1 <= version_code <= 2100000000: raise ValueError('Invalid versionCode')
          version_name = os.environ.get('APP_VERSION_NAME') or '1.1.0'
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,3}', version_name): raise ValueError('Use a numeric version name, e.g. 1.1.0')
          gradle = base / 'android/app/build.gradle'
          s = gradle.read_text()
          s = re.sub(r'versionCode \d+', f'versionCode {version_code}', s)
          s = re.sub(r'versionName "[^"]+"', f'versionName "{version_name}"', s)
          # Kotlin 1.6 jdk7/jdk8 artifacts duplicate classes now merged into kotlin-stdlib.
          # Exclude only the obsolete split artifacts, and align stdlib using a BOM.
          s += """
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.20')
          }
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }
          }
          if (System.getenv('SIGN_RELEASE') == 'true') {
              android {
                  signingConfigs {
                      releaseUpload {
                          storeFile file(System.getenv('UPLOAD_KEYSTORE_PATH'))
                          storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                          keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
                      }
                  }
                  buildTypes {
                      release { signingConfig signingConfigs.releaseUpload }
                  }
              }
          }
          """
          gradle.write_text(s)
          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)
          manifest = base / 'android/app/src/main/AndroidManifest.xml'
          tree = ET.parse(manifest); doc = tree.getroot(); application = doc.find('application')
          application.set('{' + android_ns + '}allowBackup', 'false')
          application.set('{' + android_ns + '}fullBackupContent', 'false')
          application.set('{' + android_ns + '}dataExtractionRules', '@xml/data_extraction_rules')
          xml_dir = base / 'android/app/src/main/res/xml'
          xml_dir.mkdir(parents=True, exist_ok=True)
          exclusions = ''.join('<exclude domain="' + domain + '" path="."/>' for domain in ['root', 'file', 'database', 'sharedpref', 'external'])
          (xml_dir / 'data_extraction_rules.xml').write_text('<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup>' + exclusions + '</cloud-backup><device-transfer>' + exclusions + '</device-transfer></data-extraction-rules>')
          for permission in list(doc.findall('uses-permission')):
              doc.remove(permission)
              doc.insert(0, permission)
          application.set('{' + android_ns + '}usesCleartextTraffic', 'false')
          activity = application.find('activity')
          activity.set('{' + android_ns + '}windowSoftInputMode', 'adjustResize')
          # No broad storage, camera, microphone, contacts or location permission is added.
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          print(f'Prepared University Notes {version_name} ({version_code}), target API 36')
          PYNATIVE
      - name: Load your existing Play upload key
        if: env.SIGN_RELEASE == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PYKEY'
          import os, base64
          from pathlib import Path
          required = ['UPLOAD_KEYSTORE_BASE64', 'UPLOAD_KEYSTORE_PASSWORD', 'UPLOAD_KEY_ALIAS', 'UPLOAD_KEY_PASSWORD']
          missing = [key for key in required if not os.environ.get(key)]
          if missing: raise SystemExit('Missing repository Secrets: ' + ', '.join(missing))
          key_path = Path(os.environ['RUNNER_TEMP']) / 'university-notes-upload.jks'
          key_path.write_bytes(base64.b64decode(os.environ['UPLOAD_KEYSTORE_BASE64'], validate=True))
          key_path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write(f'UPLOAD_KEYSTORE_PATH={key_path}\n')
          PYKEY
      - name: Build test APK and release AAB; check release lint
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleDebug :app:bundleRelease :app:lintRelease
          mkdir -p "$WORK_DIR/deliverables"
          cp app/build/outputs/apk/debug/app-debug.apk "$WORK_DIR/deliverables/University-Notes-TEST-ONLY.apk"
          if [ "$SIGN_RELEASE" = 'true' ]; then
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab
            cp app/build/outputs/bundle/release/app-release.aab "$WORK_DIR/deliverables/University-Notes-PLAY-SIGNED.aab"
          else
            cp app/build/outputs/bundle/release/app-release.aab "$WORK_DIR/deliverables/University-Notes-UNSIGNED-NOT-FOR-UPLOAD.aab"
          fi
      - name: Upload Android files
        uses: actions/upload-artifact@v4
        with:
          name: University-Notes-Android-${{ github.run_number }}
          path: ${{ env.WORK_DIR }}/deliverables/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: University-Notes-Lint-${{ github.run_number }}
          path: ${{ env.WORK_DIR }}/android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/university-notes-upload.jks"
