name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor Project
        shell: bash
        run: |
          set -e

          npm init -y

          npm install --no-audit --no-fund \
            @capacitor/core@8 \
            @capacitor/cli@8 \
            @capacitor/android@8

          mkdir -p www

          cp wakil.html www/index.html

          npx cap init "University Notes" "com.noori.universitynotes" --web-dir www

          npx cap add android

          npx cap sync android

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")

          if p.exists():
              s = p.read_text()

              s = re.sub(
                  r'minSdkVersion\s*=\s*\d+',
                  'minSdkVersion = 24',
                  s
              )

              s = re.sub(
                  r'compileSdkVersion\s*=\s*\d+',
                  'compileSdkVersion = 36',
                  s
              )

              s = re.sub(
                  r'targetSdkVersion\s*=\s*\d+',
                  'targetSdkVersion = 36',
                  s
              )

              p.write_text(s)
          PY

      - name: Verify Android Project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f www/index.html

          echo "Android project created successfully."
          echo "Web file copied successfully."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon \
            -Pandroid.useAndroidX=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversityNotes-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
