              }
              private void showError(){runOnUiThread(()->{if(closed)return;status.setText(text("دا PDF نه پرانیستل کېږي. ښايي خراب، ډېر غټ یا په پټنوم تړلی وي.","این PDF باز نمی‌شود؛ ممکن است خراب، بسیار بزرگ یا رمزدار باشد.","Unable to read this PDF. It may be damaged, too large or password protected."));controls(pageCount>0);});}
