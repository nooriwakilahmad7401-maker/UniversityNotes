                  plus=button("+",controls,()->{zoom=Math.min(3,zoom+.5f);render();});plus.setContentDescription(text("لوی کول","بزرگ کردن","Zoom in"));
                  next=button("›",controls,()->{if(pageIndex+1<pageCount){pageIndex++;render();}});next.setContentDescription(text("بله پاڼه","صفحۀ بعدی","Next page"));root.addView(controls);setContentView(root);controls(false);
